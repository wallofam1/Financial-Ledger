<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ledger — Net Worth</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Public+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<style>
  :root{
    --bg:#12151A;
    --surface:#1B1F26;
    --surface-2:#20242C;
    --hairline:#2B313B;
    --ink:#EDEAE2;
    --ink-muted:#8B93A1;
    --asset:#8FB682;
    --asset-dim:#628755;
    --liability:#C29CB8;
    --liability-dim:#8D6884;
    --gold:#B7C4DB;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Public Sans', -apple-system, sans-serif;
    padding:28px 20px 60px;
    min-height:100vh;
  }
  .wrap{max-width:920px;margin:0 auto;}

  /* Masthead */
  .masthead{
    display:flex;justify-content:space-between;align-items:flex-end;
    border-bottom:1px solid var(--hairline);
    padding-bottom:18px;margin-bottom:26px;
    flex-wrap:wrap;gap:12px;
  }
  .masthead h1{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:28px;
    letter-spacing:0.01em;
    margin:0;
  }
  .masthead .eyebrow{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--ink-muted);
    display:block;margin-bottom:4px;
  }
  .as-of{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    color:var(--ink-muted);
    text-align:right;
  }

  /* Summary row */
  .summary{
    display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:14px;
    margin-bottom:28px;
  }
  @media (max-width:640px){.summary{grid-template-columns:1fr;}}
  .card{
    background:var(--surface);
    border:1px solid var(--hairline);
    border-radius:var(--radius);
    padding:18px 20px;
  }
  .card .label{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;letter-spacing:0.1em;text-transform:uppercase;
    color:var(--ink-muted);margin-bottom:8px;
  }
  .card .figure{
    font-family:'IBM Plex Mono', monospace;
    font-size:30px;font-weight:600;
    line-height:1.1;
  }
  .card.net .figure{color:var(--gold);font-size:34px;}
  .card .delta{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;margin-top:8px;
  }
  .delta.up{color:var(--asset);}
  .delta.down{color:var(--liability);}
  .card.assets .figure{color:var(--asset);}
  .card.liabilities .figure{color:var(--liability);}

  /* Chart */
  .chart-card{
    background:var(--surface);border:1px solid var(--hairline);
    border-radius:var(--radius);padding:20px;margin-bottom:28px;
  }
  .chart-card h2, .section h2{
    font-family:'Fraunces', serif;font-weight:500;font-size:16px;
    margin:0 0 14px;color:var(--ink);
  }
  .chart-wrap{height:220px;}
  .empty-note{
    font-family:'IBM Plex Mono', monospace;color:var(--ink-muted);
    font-size:12px;text-align:center;padding:40px 0;
  }

  /* Ledger sections */
  .ledger-cols{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:22px;}
  @media (max-width:640px){.ledger-cols{grid-template-columns:1fr;}}
  .section{
    background:var(--surface);border:1px solid var(--hairline);
    border-radius:var(--radius);padding:18px 20px;
  }
  .section h2 .tally{
    font-family:'IBM Plex Mono', monospace;font-weight:400;
    font-size:12px;color:var(--ink-muted);margin-left:8px;
  }
  .row{
    display:flex;align-items:center;gap:8px;
    padding:9px 0;border-bottom:1px dashed var(--hairline);
  }
  .row:last-of-type{border-bottom:none;}
  .row input.name{
    flex:1;background:none;border:none;color:var(--ink);
    font-family:'Public Sans';font-size:14px;padding:4px 2px;
    border-bottom:1px solid transparent;
  }
  .row input.name:focus{outline:none;border-bottom:1px solid var(--hairline);}
  select.cat{
    background:var(--surface-2);border:1px solid var(--hairline);
    color:var(--ink-muted);font-family:'IBM Plex Mono';font-size:11px;
    border-radius:6px;padding:4px 6px;max-width:110px;
  }
  .row input.balance{
    width:110px;background:var(--surface-2);border:1px solid var(--hairline);
    color:var(--ink);font-family:'IBM Plex Mono';font-size:14px;
    text-align:right;padding:6px 8px;border-radius:6px;
  }
  .row .del{
    background:none;border:none;color:var(--ink-muted);
    cursor:pointer;font-size:15px;padding:2px 6px;line-height:1;
  }
  .row .del:hover{color:var(--liability);}
  .add-row{
    margin-top:10px;background:none;border:1px dashed var(--hairline);
    color:var(--ink-muted);font-family:'IBM Plex Mono';font-size:12px;
    padding:8px 10px;border-radius:6px;cursor:pointer;width:100%;
  }
  .add-row:hover{color:var(--ink);border-color:var(--ink-muted);}
  .section.assets h2{color:var(--asset);}
  .section.liabilities h2{color:var(--liability);}

  /* Actions */
  .actions{
    display:flex;gap:10px;flex-wrap:wrap;justify-content:space-between;
    align-items:center;margin-top:8px;
  }
  .actions .left{display:flex;gap:10px;flex-wrap:wrap;}
  button.primary{
    background:var(--gold);color:#1B1B16;border:none;
    font-family:'IBM Plex Mono';font-weight:600;font-size:12px;
    letter-spacing:0.04em;text-transform:uppercase;
    padding:10px 16px;border-radius:6px;cursor:pointer;
  }
  button.primary:hover{filter:brightness(1.08);}
  button.ghost{
    background:none;border:1px solid var(--hairline);color:var(--ink-muted);
    font-family:'IBM Plex Mono';font-size:12px;padding:10px 14px;
    border-radius:6px;cursor:pointer;
  }
  button.ghost:hover{color:var(--ink);border-color:var(--ink-muted);}
  .save-msg{
    font-family:'IBM Plex Mono';font-size:11px;color:var(--asset);
    opacity:0;transition:opacity .3s;
  }
  .save-msg.show{opacity:1;}
  #importFile{display:none;}
  footer{
    text-align:center;color:var(--ink-muted);font-family:'IBM Plex Mono';
    font-size:11px;margin-top:30px;
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="masthead">
    <div>
      <span class="eyebrow">Personal Ledger</span>
      <h1>Net Worth</h1>
    </div>
    <div class="as-of" id="asOf">—</div>
  </div>

  <div class="summary">
    <div class="card net">
      <div class="label">Net Worth</div>
      <div class="figure" id="netWorthFig">$0</div>
      <div class="delta" id="netDelta"></div>
    </div>
    <div class="card assets">
      <div class="label">Total Assets</div>
      <div class="figure" id="assetsFig">$0</div>
    </div>
    <div class="card liabilities">
      <div class="label">Total Liabilities</div>
      <div class="figure" id="liabFig">$0</div>
    </div>
  </div>

  <div class="chart-card">
    <h2>History</h2>
    <div class="chart-wrap"><canvas id="historyChart"></canvas></div>
    <div class="empty-note" id="chartEmpty" style="display:none;">No snapshots yet — click "Save Snapshot" below to start your history.</div>
  </div>

  <div class="ledger-cols">
    <div class="section assets">
      <h2>Assets <span class="tally" id="assetsTally"></span></h2>
      <div id="assetsRows"></div>
      <button class="add-row" data-type="asset">+ Add asset</button>
    </div>
    <div class="section liabilities">
      <h2>Liabilities <span class="tally" id="liabTally"></span></h2>
      <div id="liabRows"></div>
      <button class="add-row" data-type="liability">+ Add liability</button>
    </div>
  </div>

  <div class="actions">
    <div class="left">
      <button class="primary" id="snapshotBtn">Save Snapshot</button>
      <button class="ghost" id="exportBtn">Export JSON</button>
      <button class="ghost" id="importBtn">Import JSON</button>
      <input type="file" id="importFile" accept="application/json">
    </div>
    <span class="save-msg" id="saveMsg">Saved</span>
  </div>

  <footer>Data is stored locally in this file's browser context. Export regularly to back up into your vault.</footer>
</div>

<script>
const STORAGE_KEY = 'ledger-networth-v1';
const ASSET_CATS = ['Cash','Investments','Retirement','Real Estate','Vehicles','Other'];
const LIAB_CATS = ['Credit Card','Loan','Mortgage','Other'];

function uid(){ return Math.random().toString(36).slice(2,9); }

function loadData(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){ console.error('Load failed', e); }
  return {
    accounts:[
      {id:uid(), name:'Checking', category:'Cash', type:'asset', balance:0},
      {id:uid(), name:'Credit Card', category:'Credit Card', type:'liability', balance:0}
    ],
    history:[]
  };
}

let data = loadData();

function saveData(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    flashSaved();
  }catch(e){ console.error('Save failed', e); }
}

function flashSaved(){
  const el = document.getElementById('saveMsg');
  el.textContent = 'Saved';
  el.classList.add('show');
  clearTimeout(flashSaved._t);
  flashSaved._t = setTimeout(()=>el.classList.remove('show'), 1200);
}

function fmt(n){
  const sign = n < 0 ? '-' : '';
  return sign + '$' + Math.abs(Math.round(n)).toLocaleString('en-US');
}

function totals(){
  let assets=0, liabilities=0;
  data.accounts.forEach(a=>{
    const v = Number(a.balance)||0;
    if(a.type==='asset') assets += v; else liabilities += v;
  });
  return {assets, liabilities, net: assets-liabilities};
}

function renderRows(){
  const aWrap = document.getElementById('assetsRows');
  const lWrap = document.getElementById('liabRows');
  aWrap.innerHTML=''; lWrap.innerHTML='';
  data.accounts.forEach(acc=>{
    const row = document.createElement('div');
    row.className='row';
    const cats = acc.type==='asset' ? ASSET_CATS : LIAB_CATS;
    row.innerHTML = `
      <input class="name" value="${escapeHtml(acc.name)}" data-id="${acc.id}" data-field="name">
      <select class="cat" data-id="${acc.id}" data-field="category">
        ${cats.map(c=>`<option value="${c}" ${c===acc.category?'selected':''}>${c}</option>`).join('')}
      </select>
      <input class="balance" type="number" value="${acc.balance}" data-id="${acc.id}" data-field="balance">
      <button class="del" data-id="${acc.id}" title="Remove">✕</button>
    `;
    (acc.type==='asset' ? aWrap : lWrap).appendChild(row);
  });

  document.querySelectorAll('.name, .balance').forEach(el=>{
    el.addEventListener('input', onFieldChange);
  });
  document.querySelectorAll('.cat').forEach(el=>{
    el.addEventListener('change', onFieldChange);
  });
  document.querySelectorAll('.del').forEach(el=>{
    el.addEventListener('click', ()=>{
      data.accounts = data.accounts.filter(a=>a.id!==el.dataset.id);
      saveData(); renderAll();
    });
  });
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function onFieldChange(e){
  const {id, field} = e.target.dataset;
  const acc = data.accounts.find(a=>a.id===id);
  if(!acc) return;
  acc[field] = field==='balance' ? Number(e.target.value)||0 : e.target.value;
  saveData();
  renderSummary();
  renderTallies();
}

function renderSummary(){
  const t = totals();
  document.getElementById('assetsFig').textContent = fmt(t.assets);
  document.getElementById('liabFig').textContent = fmt(t.liabilities);
  document.getElementById('netWorthFig').textContent = fmt(t.net);

  const deltaEl = document.getElementById('netDelta');
  if(data.history.length){
    const prev = data.history[data.history.length-1];
    const diff = t.net - prev.netWorth;
    if(Math.abs(diff) > 0.5){
      deltaEl.textContent = (diff>=0?'▲ ':'▼ ') + fmt(Math.abs(diff)) + ' since last snapshot';
      deltaEl.className = 'delta ' + (diff>=0?'up':'down');
    } else {
      deltaEl.textContent = 'No change since last snapshot';
      deltaEl.className = 'delta';
    }
  } else {
    deltaEl.textContent = '';
  }

  document.getElementById('asOf').textContent = 'As of ' + new Date().toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
}

function renderTallies(){
  const aCount = data.accounts.filter(a=>a.type==='asset').length;
  const lCount = data.accounts.filter(a=>a.type==='liability').length;
  document.getElementById('assetsTally').textContent = aCount + (aCount===1?' account':' accounts');
  document.getElementById('liabTally').textContent = lCount + (lCount===1?' account':' accounts');
}

let chart;
function renderChart(){
  const canvas = document.getElementById('historyChart');
  const emptyNote = document.getElementById('chartEmpty');
  if(!data.history.length){
    canvas.style.display='none'; emptyNote.style.display='block';
    return;
  }
  canvas.style.display='block'; emptyNote.style.display='none';

  const labels = data.history.map(h=>new Date(h.date).toLocaleDateString('en-US',{month:'short',day:'numeric'}));
  const netData = data.history.map(h=>h.netWorth);

  if(chart) chart.destroy();
  chart = new Chart(canvas.getContext('2d'), {
    type:'line',
    data:{
      labels,
      datasets:[{
        label:'Net Worth',
        data:netData,
        borderColor:'#DCE3ED',
        backgroundColor:'rgba(220,227,237,0.12)',
        borderWidth:2,
        pointRadius:3,
        pointBackgroundColor:'#DCE3ED',
        tension:0.25,
        fill:true
      }]
    },
    options:{
      responsive:true, maintainAspectRatio:false,
      plugins:{ legend:{display:false},
        tooltip:{callbacks:{label:(ctx)=>fmt(ctx.parsed.y)}}
      },
      scales:{
        x:{ ticks:{ color:'#8B93A1', font:{family:'IBM Plex Mono', size:10} }, grid:{ color:'#2B313B' } },
        y:{ ticks:{ color:'#8B93A1', font:{family:'IBM Plex Mono', size:10}, callback:(v)=>fmt(v) }, grid:{ color:'#2B313B' } }
      }
    }
  });
}

function renderAll(){
  renderRows();
  renderSummary();
  renderTallies();
  renderChart();
}

document.querySelectorAll('.add-row').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    const type = btn.dataset.type;
    data.accounts.push({
      id:uid(), name:'New ' + (type==='asset'?'Asset':'Liability'),
      category: type==='asset'?ASSET_CATS[0]:LIAB_CATS[0],
      type, balance:0
    });
    saveData(); renderAll();
  });
});

document.getElementById('snapshotBtn').addEventListener('click', ()=>{
  const t = totals();
  const today = new Date().toISOString().slice(0,10);
  const existingIdx = data.history.findIndex(h=>h.date===today);
  const entry = {date:today, netWorth:t.net, totalAssets:t.assets, totalLiabilities:t.liabilities};
  if(existingIdx>-1) data.history[existingIdx] = entry;
  else data.history.push(entry);
  data.history.sort((a,b)=>a.date.localeCompare(b.date));
  saveData(); renderAll();
});

document.getElementById('exportBtn').addEventListener('click', ()=>{
  const blob = new Blob([JSON.stringify(data,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'networth-data-' + new Date().toISOString().slice(0,10) + '.json';
  a.click();
  URL.revokeObjectURL(url);
});

document.getElementById('importBtn').addEventListener('click', ()=>{
  document.getElementById('importFile').click();
});
document.getElementById('importFile').addEventListener('change', (e)=>{
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (ev)=>{
    try{
      const parsed = JSON.parse(ev.target.result);
      if(parsed.accounts && parsed.history){
        data = parsed;
        saveData(); renderAll();
      } else {
        alert('This file does not look like a valid net worth export.');
      }
    }catch(err){
      alert('Could not read that file.');
    }
  };
  reader.readAsText(file);
  e.target.value = '';
});

renderAll();
</script>
</body>
</html>
